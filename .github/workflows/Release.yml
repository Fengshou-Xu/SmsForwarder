name: Release

# 自定义构建：推送 v* 开头的 tag，或在 Actions 页面手动运行（填一个 tag 名）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布用的 tag 名，例如 v3.5.0-custom.2'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 安装 JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '11'
          cache: gradle

      - name: 从 Secrets 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"   || { echo "缺少 Secret：KEYSTORE_BASE64";   exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "缺少 Secret：KEYSTORE_PASSWORD"; exit 1; }
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/smsf.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE/keystore/smsf.jks" "$KEYSTORE_PASSWORD" "smsf" "$KEYSTORE_PASSWORD" \
            > keystore/keystore.properties
          keytool -list -keystore keystore/smsf.jks -storepass "$KEYSTORE_PASSWORD" -alias smsf >/dev/null \
            && echo "密钥库可读，别名 smsf 存在"

      - name: 构建 Release APK
        run: bash ./gradlew assembleRelease --no-daemon

      - name: 打印 APK 签名指纹
        run: |
          set -euo pipefail
          for apk in build/app/outputs/apk/release/SmsF_*.apk; do
            echo "== $(basename "$apk")"
            keytool -printcert -jarfile "$apk" | grep -E 'Owner:|SHA256:' | head -2
          done

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          BASE="$(git rev-parse --short HEAD)"
          gh release create "$TAG" build/app/outputs/apk/release/SmsF_*.apk \
            --target "$GITHUB_SHA" \
            --title "SmsForwarder $TAG (custom)" \
            --notes "自定义构建，基于本仓库提交 $BASE。改动：去除友盟统计 SDK；各发送通道与更新检查恢复 TLS 证书校验。日常安装 arm64-v8a 版本。"
